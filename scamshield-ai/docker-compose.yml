services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scamshield}
      POSTGRES_USER: ${POSTGRES_USER:-scamshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5433:5432"
    volumes:
      - scamshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scamshield} -d ${POSTGRES_DB:-scamshield}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scamshield}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-scamshield}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  scamshield_pgdata:
